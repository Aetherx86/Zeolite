# cargo audit settings. Each ignored advisory needs a reason and a way out.
[advisories]
ignore = [
    # atomic-polyfill is unmaintained, not vulnerable. It arrives through wasmtime and Cranelift:
    # postcard -> heapless 0.7 -> atomic-polyfill. It goes away when they move to heapless 0.8.
    "RUSTSEC-2023-0089",
]
